name: Generate Keystore (jalankan SEKALI sahaja)
 
on:
  workflow_dispatch:
 
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
 
      - name: Jana keystore (password = Kukusan2026!)
        run: |
          keytool -genkeypair -v -keystore kukusan.keystore -alias kukusan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "Kukusan2026!" -keypass "Kukusan2026!" \
            -dname "CN=Kukusan, OU=Kukusan, O=Kukusan, L=Malaysia, S=Malaysia, C=MY"
 
      - name: Convert ke base64 (satu baris, senang copy-paste)
        run: base64 -w 0 kukusan.keystore > base64.txt
 
      - uses: actions/upload-artifact@v4
        with:
          name: kukusan-keystore-dan-base64
          path: |
            kukusan.keystore
            base64.txt
