name: Build KUKUSAN Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sediakan fail web (splash + halaman offline)
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp offline.html www/offline.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp -r icons www/icons
          cp sw.js www/sw.js

      - name: Install Capacitor
        run: npm install

      - name: Cipta projek Android
        run: npx cap add android

      - name: Jana ikon app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#F4F1FF' --splashBackgroundColor '#F4F1FF' || echo "Ikon dilangkau"

      - name: Sync
        run: npx cap sync android

      - name: Set versi APK
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: Kunci tandatangan tetap (supaya update tak perlu uninstall)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Guna keystore tetap dari secret"
          else
            echo "::warning::Secret KEYSTORE_BASE64 tiada - APK akan guna kunci rawak (update perlu uninstall). Kalau nak ganti APK PWABuilder sedia ada (app.web.kukusanmy.twa) tanpa customer uninstall dulu, mesti guna keystore ASAL yang sama."
          fi

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Namakan semula APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KUKUSAN-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KUKUSAN-Admin-APK
          path: KUKUSAN-Admin.apk

      - name: Terbit release (untuk auto update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KUKUSAN Admin 1.0.${{ github.run_number }}
          files: KUKUSAN-Admin.apk
          make_latest: true
